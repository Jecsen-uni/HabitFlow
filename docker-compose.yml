services:
  postgres:
    image: postgres:16
    container_name: habit_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - habit_tracker_data:/var/lib/postgresql/data

volumes:
  habit_tracker_data:
